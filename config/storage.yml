---
test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

amazon:
  service: S3
  access_key_id: <%= ENV.fetch('AWS_ACCESS_KEY_ID') %>
  secret_access_key: <%= ENV.fetch('AWS_SECRET_ACCESS_KEY') %>
  region: <%= ENV.fetch('AWS_REGION') %>
  bucket: <%= ENV.fetch('S3_BUCKET_NAME') %>
  upload:
    acl: "public-read"

# Cloudflare R2 via its S3-compatible API.
# R2 doesn't support object ACLs, so no `upload: acl` here — objects are
# private and served via Active Storage's signed redirect URLs.
cloudflare:
  service: S3
  access_key_id: <%= ENV['R2_ACCESS_KEY_ID'] %>
  secret_access_key: <%= ENV['R2_SECRET_ACCESS_KEY'] %>
  endpoint: https://<%= ENV['R2_ACCOUNT_ID'] %>.r2.cloudflarestorage.com
  region: auto
  bucket: <%= ENV['R2_BUCKET_NAME'] %>
  # aws-sdk-s3 >= 1.178 sends CRC32 checksums on every request by default,
  # which R2 doesn't fully support. Only checksum when the API requires it.
  request_checksum_calculation: when_required
  response_checksum_validation: when_required

# Transitional S3 <-> R2 mirror (Rails 7.1 semantics):
# - uploads go to the primary synchronously, then ActiveStorage::MirrorJob
#   (Sidekiq, `default` queue) copies them to the mirror
# - deletes go to both
# - reads/URLs come from the primary Flip with STORAGE_MIRROR_PRIMARY
# (amazon | cloudflare) — no deploy needed, just a config:set + restart.
<% mirror_primary = ENV.fetch('STORAGE_MIRROR_PRIMARY', 'amazon') %>
mirror:
  service: Mirror
  primary: <%= mirror_primary %>
  mirrors:
    - <%= mirror_primary == 'amazon' ? 'cloudflare' : 'amazon' %>
